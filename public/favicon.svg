<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vibrant Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Gold Mastery Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.25" filter="url(#strongGlow)" />
  <circle cx="320" cy="180" r="90" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Bottom Platform / Syllabus Layer -->
  <path d="M128 352 L256 416 L384 352 L256 288 Z" fill="url(#brandGrad)" opacity="0.3" />
  <path d="M128 352 L256 416 L384 352" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Middle Topic Master Hierarchy Layer -->
  <path d="M128 288 L256 352 L384 288 L256 224 Z" fill="url(#brandGrad)" opacity="0.6" />
  <path d="M128 288 L256 352 L384 288" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Geometric Mastery Crown / Diamond Cube -->
  <path d="M128 224 L256 288 L384 224 L256 160 Z" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Stylized "T" / "M" Architecture -->
  <path d="M180 200 L256 160 L332 200 L256 240 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Vertical Pillar to Base -->
  <path d="M256 160 L256 288" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M128 224 L128 352" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M384 224 L384 352" stroke="url(#brandGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Apex Mastery Sparkle (Four-Point Star) -->
  <path d="M356 100 Q356 132 388 132 Q356 132 356 164 Q356 132 324 132 Q356 132 356 100 Z" fill="url(#goldGrad)" filter="url(#strongGlow)" />
  <circle cx="356" cy="132" r="4" fill="#ffffff" />

  <!-- Small Target Orbit Dot -->
  <circle cx="160" cy="140" r="10" fill="url(#cyanGrad)" filter="url(#glow)" />
  <circle cx="160" cy="140" r="4" fill="#ffffff" />
</svg>
